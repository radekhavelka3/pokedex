<!-- ZAČÁTEK HTML DOKUMENTU -->
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pokédex Aplikace{% endblock %}</title>

    <!-- EXTERNÍ STYLY (Bootstrap 5 a Ikony) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- VLASTNÍ STYLY APLIKACE -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- HLAVNÍ OBALOVACÍ KONTEJNER (Drží patičku dole a 100% výšku) -->
    <div class="wrapper">

        <!-- 1. HORNÍ NAVIGAČNÍ MENU KOMPONENTA -->
        {% include 'components/menu.html' %}

        <!-- 2. HLAVIČKA A BANNER KOMPONENTA -->
        {% include 'components/header.html' %}

        <!-- ========================================== -->
        <!-- ZAČÁTEK HLAVNÍHO KONTEJNERU STRÁNKY        -->
        <!-- ========================================== -->
        <div class="container-fluid px-4 px-lg-5 my-4 flex-grow-1">
            <div class="row">

                <!-- HLAVNÍ OBSAH (Zabírá 100 % šířky) -->
                <main class="col-12">
                    <!-- ZDE SE VYKRESLUJE OBSAH Z INDEX.HTML -->
                    {% block content %}
                    {% endblock %}
                </main>

            </div>
        </div>
        <!-- ========================================== -->
        <!-- KONEC HLAVNÍHO KONTEJNERU STRÁNKY          -->
        <!-- ========================================== -->

        <!-- 3. PATIČKA STRÁNKY KOMPONENTA -->
        {% include 'components/footer.html' %}

    </div>
    <!-- KONEC OBALOVACÍHO KONTEJNERU (WRAPPER) -->

    <!-- SKRIPTY PRO BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
